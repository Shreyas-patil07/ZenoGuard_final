name: Merge ZenoGuard Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repositories
        run: |
          git clone --depth 1 https://github.com/Atharva6153-git/ZenoGuard.git /tmp/zenoguard
          git clone --depth 1 https://github.com/Shreyas-patil07/premium_prediction.git /tmp/premium_prediction
          git clone --depth 1 https://github.com/Rijuls-code/Gig-Smart-contracts.git /tmp/gig_contracts

      - name: Merge source files into monorepo
        run: |
          mkdir -p frontend backend ml/premium ml/claim_fraud blockchain

          # Main ZenoGuard application
          rsync -a --exclude='.git' --exclude='backend/zenguard.db' /tmp/zenoguard/frontend/ frontend/
          rsync -a --exclude='.git' --exclude='backend/zenguard.db' /tmp/zenoguard/backend/ backend/

          # Premium ML source
          rsync -a --exclude='.git' /tmp/premium_prediction/ ml/premium/

          # Gig insurance smart contracts
          rsync -a --exclude='.git' --exclude='contracts/Counter.sol' --exclude='test/Counter.ts' /tmp/gig_contracts/ blockchain/

          # Remove secrets and local environments from imported sources
          find . -type f \( -name '.env' -o -name '.env.*' \) -not -path './.git/*' -delete
          rm -rf frontend/node_modules backend/.venv blockchain/node_modules

          # Keep target repo metadata
          rm -f frontend/README.md blockchain/README.md

      - name: Add merge guardrails
        run: |
          cat > .gitignore <<'EOF'
          .env
          .env.*
          !.env.example
          **/.env
          **/.env.*
          node_modules/
          **/node_modules/
          .venv/
          **/.venv/
          __pycache__/
          **/__pycache__/
          *.py[cod]
          *.db
          **/*.db
          .pytest_cache/
          dist/
          build/
          .DS_Store
          EOF

      - name: Commit merged source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet || git commit -m 'merge: combine ZenoGuard, premium ML and insurance contracts [skip merge]'
          git push